name: Build & Package Extension

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer le build manuellement depuis l'interface GitHub

jobs:
  build:
    name: Build Extension Package
    runs-on: ubuntu-latest

    permissions:
      contents: write # Requis pour publier les releases automatiques

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate icons and build Store zip package
        run: |
          python build_package.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoHistory-Extension-Package
          path: dist/*.zip
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          name: GeoHistory ${{ github.ref_name }}
